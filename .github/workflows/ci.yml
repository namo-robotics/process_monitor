# Build and test on native hosts; publish only a complete, tested release matrix.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  compile:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            triple: x86_64-linux-gnu
          - runner: ubuntu-24.04
            target: linux-arm64
            triple: aarch64-linux-gnu
          - runner: macos-14
            target: macos-arm64
            triple: arm64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux compiler runtime and native linker
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 20
          sudo apt-get install -y libllvm20 g++

      - name: Install ARM64 cross linker
        if: matrix.target == 'linux-arm64'
        run: sudo apt-get install -y g++-aarch64-linux-gnu

      - name: Install macOS compiler runtime
        if: runner.os == 'macOS'
        run: brew install llvm@20

      - name: Cache checksum-pinned release downloads
        uses: actions/cache@v4
        with:
          path: .ci/downloads
          key: sun-release-${{ runner.os }}-${{ hashFiles('toolchain.lock.json') }}

      - name: Install precompiled Sun and matching stdlibs
        run: scripts/ci-toolchain.sh

      - name: Select target standard library
        env:
          TARGET_TRIPLE: ${{ matrix.triple }}
        run: |
          echo "$GITHUB_WORKSPACE/.ci/toolchain/bin" >> "$GITHUB_PATH"
          mkdir -p build
          cp ".ci/toolchain/lib/sun/$TARGET_TRIPLE/stdlib.moon" build/stdlib.moon

      - name: Check formatting
        run: sun fmt --check src tests

      - name: Build application and tests
        env:
          SUN_TARGET: ${{ matrix.target == 'linux-arm64' && matrix.triple || '' }}
        run: scripts/build.sh

      - name: Bundle executables for native testing
        run: tar -czf build/test-binaries.tar.gz -C build process_monitor process_monitor_test

      - uses: actions/upload-artifact@v4
        with:
          name: test-binaries-${{ matrix.target }}
          path: build/test-binaries.tar.gz
          if-no-files-found: error
          retention-days: 3

  test:
    name: Test ${{ matrix.target }}
    needs: compile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-14
            target: macos-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: test-binaries-${{ matrix.target }}
          path: build

      - name: Run native unit, workload, replay, and terminal tests
        run: |
          tar -xzf build/test-binaries.tar.gz -C build
          build/process_monitor_test
          python3 tests/integration.py

      - name: Package and smoke-test release archive
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_REF: ${{ github.ref_name }}
          PACKAGE_SHA: ${{ github.sha }}
          PACKAGE_REF_TYPE: ${{ github.ref_type }}
        run: |
          version="commit-${PACKAGE_SHA:0:12}"
          if [[ "$PACKAGE_REF_TYPE" == tag ]]; then version="$PACKAGE_REF"; fi
          python3 scripts/package.py "$version" "$PACKAGE_TARGET" "$PACKAGE_SHA"

      - name: Upload tested binaries
        uses: actions/upload-artifact@v4
        with:
          name: process-monitor-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged binaries
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: process-monitor-*
          path: dist
          merge-multiple: true

      - name: Verify complete release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          for target in linux-x86_64 linux-arm64 macos-arm64; do
            archive="process_monitor-$RELEASE_TAG-$target.tar.gz"
            test -f "$archive"
            sha256sum --check "$archive.sha256"
          done
          cat ./*.sha256 > SHA256SUMS
          # Keep partial uploads in a draft; reruns may resume an unfinished draft.
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Release already published; use a new tag"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
